// =============================================================
// ConformalHeatShields - Aero adjustments
//
// ConformalDecals' own patch (Patches/Aero.cfg) zeroes the drag
// cube of EVERY part that carries a ModuleConformalDecal, because
// decals are just paint. Our CDH-1 coating, however, is a real
// thermal part: without a drag cube it would never collect
// convective reentry heat and could never ablate.
//
// This patch runs AFTER ConformalDecals, deletes the zeroed cube
// and lets KSP regenerate a proper drag cube from the model at
// load time.
//
// If you want the coating to behave like pure 'paint' (no drag,
// no convective heating), simply delete this file.
// =============================================================

@PART[chs-ablator-*]:AFTER[ConformalDecals]
{
  !DRAG_CUBE {}
}
