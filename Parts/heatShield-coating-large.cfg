// =============================================================
// Peel-N-Stik Thermal - CDH-2 Large Ablative Coating Panel
// Big preset version of the CDH-1 coating: spawns at 6x scale
// for fast coverage of tanks, station hulls and plane bodies.
// Same decal system, same texture atlas, same variants.
//
// REQUIRES: ConformalDecals, B9PartSwitch, ModuleManager
// =============================================================

PART
{
  name = chs-ablator-coating-large
  module = Part
  author = Peel-N-Stik Thermal

  MODEL
  {
    model = ConformalDecals/Assets/decal-blank
    scale = 1.0, 1.0, 1.0
  }
  rescaleFactor = 1

  // Attachment - surface attach everywhere, like the ConformalDecals parts
  attachRules = 1,1,0,0,1
  node_attach = 0.0, 0.0, 0.05, 0.0, 0.0, -1.0

  // Tech
  TechRequired = survivability
  entryCost = 2400

  // Info
  cost = 900
  category = Thermal
  subcategory = 0

  // CDH-2 Large Ablative Coating Panel
  title = CDH-2 Large Ablative Coating Panel

  // Peel-N-Stik Adhesive Decals
  manufacturer = Peel-N-Stik Adhesive Decals

  // Industrial-size version of our ablative coating sheet. Spawns big (6x)
  // so you can blanket a whole tank or fuselage in one go - fine tuning
  // from 2x up to 20x with the Scale slider afterwards.
  description = The CDH-2 is what happens when the procurement department gets a bulk order of our CDH-1 coating sheet. Comes pre-cut at industrial size and heat-treated for the same blazing reentries - stick it on stations, megatankers or the underside of that thing you are definitely landing back on the Mun.

  // conformal heat shield thermal ablator coating tiles reentry protection large
  tags = ablat entry therm protect shield coat tile large

  bulkheadProfiles = srf

  // ------------------------------------------------------------------------
  // Physical and thermal parameters (see heatShield-coating.cfg)
  // ------------------------------------------------------------------------
  mass = 0.06
  dragModelType = default
  maximum_drag = 0.2
  minimum_drag = 0.2
  angularDrag = 0.5
  breakingForce = 350
  breakingTorque = 200
  crashTolerance = 9
  maxTemp = 3300
  fuelCrossFeed = False
  PhysicsSignificance = 0
  thermalMassModifier = 1.0

  MODULE
  {
    name = ModuleAblator
    ablativeResource = Ablator
    lossExp = -7500
    lossConst = 0.1
    pyrolysisLossFactor = 6000
    reentryConductivity = 0.01
    ablationTempThresh = 500

    // ConformalDecals shaders have no _BurnColor channel
    useChar = False
  }

  RESOURCE
  {
    name = Ablator
    amount = 600
    maxAmount = 600
  }

  // ------------------------------------------------------------------------
  // Conformal placement - spawns big, tunable from 2x to 20x
  // ------------------------------------------------------------------------
  MODULE
  {
    name = ModuleConformalDecal

    useBaseNormal = true

    tile = 0, 0, 512, 512

    defaultScale = 6.0
    defaultDepth = 0.1
    defaultOpacity = 1.0

    opacityAdjustable = true

    cutoff = 0
    cutoffAdjustable = false

    scaleRange = 2, 20
    scaleMode = AVERAGE

    // allow the projection to spill onto neighboring parts
    projectMultiple = true

    shader = ConformalDecals/Decal/Standard

    KEYWORD {
      name = DECAL_SDF_ALPHA
      value = false
    }

    TEXTURE {
      name = _Decal
      textureUrl = PeelNStikThermal/Parts/Textures/chs-decal-atlas
      isMain = true
      autoTile = true
    }

    TEXTURE {
      name = _SpecMap
      textureUrl = ConformalDecals/Assets/Decal-Spec
      autoScale = true
    }
  }

  // Surface patterns - one per quadrant of chs-decal-atlas.dds (bottom left origin)
  MODULE {
    name = ModuleB9PartSwitch

    SUBTYPE {
      name = tiles
      title = Ablative Tiles
      primaryColor = Black
      secondaryColor = Grey

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 0, 0, 512, 512
        }
      }
    }

    SUBTYPE {
      name = charred
      title = Scorched Ablator
      primaryColor = Black
      secondaryColor = Red

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 512, 0, 512, 512
        }
      }
    }

    SUBTYPE {
      name = blanket
      title = Thermal Blanket
      primaryColor = White
      secondaryColor = Grey

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 0, 512, 512, 512
        }
      }
    }

    SUBTYPE {
      name = loxg
      title = Clean Tile
      primaryColor = White
      secondaryColor = Black

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 512, 512, 512, 512
        }
      }
    }
  }

  // Spread protection to nearby parts (dynamically adds a thin ablator
  // layer to parts within the radius; crewed parts and real heat shields
  // are skipped). Tune radius / per-part amount in the part menu.
  MODULE
  {
    name = ModuleHeatSpread
    spreadRadius = 3
    ablatorPerPart = 25
    _autoSpread = true
    spawnTwins = false
  }

  MODULE
  {
    name = ModuleCargoPart
    packedVolume = 500
  }
}
