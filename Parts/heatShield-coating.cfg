// =============================================================
// ConformalHeatShields - CDH-1 Ablative Coating Tiles
// A Peel-N-Stik(TM) style conformal ablator sheet, based on the
// ConformalDecals decal system by Andrew Cassidy / EnusAE.
// Place it on any hull, wing or tank surface like a decal,
// scale it to fit, and it aplats like a classic heat shield on
// reentry.
//
// REQUIRES: ConformalDecals, B9PartSwitch, ModuleManager
// TEXTURE:  ConformalHeatShields/Parts/Textures/chs-decal-atlas.dds
//           (2x2 quadrant atlas, see README.md)
// =============================================================

PART
{
  name = chs-ablator-coating
  module = Part
  author = ConformalHeatShields

  MODEL
  {
    model = ConformalDecals/Assets/decal-blank
    scale = 1.0, 1.0, 1.0
  }
  rescaleFactor = 1

  // Attachment - surface attach everywhere, like the ConformalDecals parts
  attachRules = 1,1,0,0,1
  node_attach = 0.0, 0.0, 0.05, 0.0, 0.0, -1.0

  // Tech
  TechRequired = survivability
  entryCost = 1800

  // Info
  cost = 350
  category = Thermal
  subcategory = 0

  // CDH-1 Ablative Coating Tiles
  title = CDH-1 Ablative Coating Tiles

  // Peel-N-Stik Adhesive Decals
  manufacturer = Peel-N-Stik Adhesive Decals

  // A conformal ablative heat shield coating. Peel off the backing and stick
  // it anywhere on your vessel - along wing leading edges, onto tanks or the
  // nose of a plane - and scale it to cover the region you want protected.
  // On reentry the coating ablates away just like a classic heat shield.
  description = A scaleable, stick-on sheet of ablative heat shielding. Unlike decorative decals this coating is a real protective layer: it ablates on reentry and shields the surface it is mounted on. Adjust scale, depth and opacity in the part menu, and switch the surface pattern with the toggle below the decal settings.

  // conformal heat shield thermal ablator coating tiles reentry protection
  tags = ablat entry therm protect shield coat tile

  bulkheadProfiles = srf

  // ------------------------------------------------------------------------
  // Physical and thermal parameters. NOTE: unlike the decorative decals of
  // ConformalDecals this part is a full physical part (PhysicsSignificance=0,
  // no physicalSignificance=NONE) so that it actually absorbs reentry heat.
  // ------------------------------------------------------------------------
  mass = 0.01
  dragModelType = default
  maximum_drag = 0.2
  minimum_drag = 0.2
  angularDrag = 0.5
  breakingForce = 350
  breakingTorque = 200
  crashTolerance = 9
  maxTemp = 3300
  fuelCrossFeed = False
  PhysicsSignificance = 0
  thermalMassModifier = 1.0

  // Incoming heat burns off the Ablator resource, exactly like the stock
  // heat shields. reentryConductivity keeps the coating from cooking the
  // part it is glued onto while the ablator lasts.
  MODULE
  {
    name = ModuleAblator
    ablativeResource = Ablator
    lossExp = -7500
    lossConst = 0.1
    pyrolysisLossFactor = 6000
    reentryConductivity = 0.01
    ablationTempThresh = 500

    // The ConformalDecals shaders have no _BurnColor channel, so the stock
    // charring effect (useChar) cannot be used here. The coating instead
    // becomes visually 'burned' when you switch to the charred variant.
    useChar = False
  }

  RESOURCE
  {
    name = Ablator
    amount = 120
    maxAmount = 120
  }

  // ------------------------------------------------------------------------
  // Conformal placement - behaves like the flag/generic decals:
  // Scale (0.25 - 8x), Depth and Opacity are adjustable in the editor.
  // ------------------------------------------------------------------------
  MODULE
  {
    name = ModuleConformalDecal

    useBaseNormal = true

    tile = 0, 0, 512, 512

    defaultScale = 1.0
    defaultDepth = 0.1
    defaultOpacity = 1.0

    opacityAdjustable = true

    cutoff = 0
    cutoffAdjustable = false

    scaleRange = 0.25, 20
    scaleMode = AVERAGE

    // allow the projection to spill onto neighboring parts
    projectMultiple = true

    shader = ConformalDecals/Decal/Standard

    KEYWORD {
      name = DECAL_SDF_ALPHA
      value = false
    }

    TEXTURE {
      name = _Decal
      textureUrl = ConformalHeatShields/Parts/Textures/chs-decal-atlas
      isMain = true
      autoTile = true
    }

    TEXTURE {
      name = _SpecMap
      textureUrl = ConformalDecals/Assets/Decal-Spec
      autoScale = true
    }
  }

  // ------------------------------------------------------------------------
  // Surface patterns - one per quadrant of chs-decal-atlas.dds.
  // Quadrants (in decal-cfg convention, origin bottom left):
  //   A (0,0)       bottom left  - ablative tile grid
  //   B (256,0)     bottom right - charred / scorched ablator
  //   C (0,256)     top left     - silver thermal blanket
  //   D (256,256)   top right    - clean white protective tile
  // Rename the subtypes below to match what you actually paint.
  // ------------------------------------------------------------------------
  MODULE {
    name = ModuleB9PartSwitch

    SUBTYPE {
      name = tiles
      title = Ablative Tiles
      primaryColor = Black
      secondaryColor = Grey

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 0, 0, 512, 512
        }
      }
    }

    SUBTYPE {
      name = charred
      title = Scorched Ablator
      primaryColor = Black
      secondaryColor = Red

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 512, 0, 512, 512
        }
      }
    }

    SUBTYPE {
      name = blanket
      title = Thermal Blanket
      primaryColor = White
      secondaryColor = Grey

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 0, 512, 512, 512
        }
      }
    }

    SUBTYPE {
      name = loxg
      title = Clean Tile
      primaryColor = White
      secondaryColor = Black

      MODULE {
        IDENTIFIER { name = ModuleConformalDecal }
        DATA {
          tile = 512, 512, 512, 512
        }
      }
    }
  }

  // Spread protection to nearby parts (dynamically adds a thin ablator
  // layer to parts within the radius; crewed parts and real heat shields
  // are skipped). Tune radius / per-part amount in the part menu.
  MODULE
  {
    name = ModuleHeatSpread
    spreadRadius = 3
    ablatorPerPart = 25
    _autoSpread = true
    spawnTwins = false
  }

  // Can be rolled up and stowed
  MODULE
  {
    name = ModuleCargoPart
    packedVolume = 90
  }
}
